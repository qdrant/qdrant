name: Rust tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ '**' ]

concurrency:
  # Pushes to dev/master get a unique group and always run to completion
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  select-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # PRs check out the merge commit, whose first parent is the base branch
        fetch-depth: 2
    - name: Select affected packages
      id: select
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          packages=$(python3 tools/ci/affected_packages.py HEAD^1)
        else
          packages=--workspace
        fi
        echo "Selected: ${packages:-<none>}"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"

  rust-tests:
    needs: select-packages
    if: needs.select-packages.outputs.packages != ''
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        # Each OS runs its tests on two runners; each builds the tests and runs half of them
        partition: [ 1, 2 ]

    steps:
    # The windows-latest image has only the slow C: drive. A ReFS Dev Drive holds the temp files the
    # tests write. The target directory stays in the workspace, where rust-cache can cache it.
    - name: Set up Dev Drive
      if: matrix.os == 'windows-latest'
      uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
      with:
        drive-size: 50GB
        trusted-dev-drive: true
        env-mapping: |
          TMP,{{ DEV_DRIVE }}/tmp
          TEMP,{{ DEV_DRIVE }}/tmp
    - name: Create temp directory on Dev Drive
      if: matrix.os == 'windows-latest'
      run: mkdir -p "$TMP"
      shell: bash
    - name: Install minimal stable
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # Before rust-cache, so the linker config and CARGO_PROFILE_DEV_DEBUG are part of the cache key
    - name: Configure linker (mold on Linux, rust-lld on Windows)
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          mkdir .cargo
          echo "[target.x86_64-unknown-linux-gnu]" >> .cargo/config.toml
          echo "linker = \"clang\"" >> .cargo/config.toml
          echo "rustflags = [\"-C\", \"link-arg=-fuse-ld=/usr/local/bin/mold\"]" >> .cargo/config.toml
        elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          mkdir .cargo
          echo "[target.x86_64-pc-windows-msvc]" >> .cargo/config.toml
          echo "linker = \"rust-lld.exe\"" >> .cargo/config.toml
          # No debug info: MSVC writes a PDB per test binary, which slows linking. Panic messages
          # keep their file:line; only backtraces lose line numbers.
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        fi
      shell: bash
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        # Only save the cache on dev; feature-branch caches would just get evicted under the 10 GB budget.
        # Both partitions build the same thing, so one of them saves it.
        save-if: ${{ github.ref == 'refs/heads/dev' && matrix.partition == 1 }}
    - name: Install Protoc
      uses: ./.github/actions/setup-protoc
    - name: Install mold
      uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
    - name: Install nextest
      uses: taiki-e/install-action@3a0adc33ab45d7b9b9da91822dd2b3c0151704be # nextest
    - name: Build
      run: cargo build ${{ needs.select-packages.outputs.packages }} --tests --locked
    # `/dev/shm` is tmpfs. The `model_testing` harness gates preallocate 32 MB gridstore pages
    # per storage per segment and peak around 4.5 GB across the five of them, so on a disk-backed
    # temp dir they are dominated by IO. Linux only: macOS and Windows have no `/dev/shm`.
    - name: Put test temp files on tmpfs
      if: matrix.os == 'ubuntu-latest'
      run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"
      shell: bash
    - name: Run tests
      # Profile "ci" is configured in .config/nextest.toml. A small PR can leave a partition without tests.
      run: cargo nextest run ${{ needs.select-packages.outputs.packages }} --profile ci --locked --partition count:${{ matrix.partition }}/2 --no-tests=warn
    - name: Upload test report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: junit-${{ matrix.os }}-${{ matrix.partition }}.xml
        path: target/nextest/ci/junit.xml

  # After tests are run, this hacky script will process the JUnit output of nextest
  # and will create a GH Issue if there is a test marked as flaky,
  # Failure of updating an issue is ignored because it fails for external contributors.
  process-results:
    runs-on: ubuntu-latest
    needs: rust-tests
    permissions:
      contents: read
      issues: write
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest  ]
        partition: [ 1, 2 ]
    steps:
      - name: Download test report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-${{ matrix.os }}-${{ matrix.partition }}.xml
      - name: Process test report
        id: process-test-report
        run: |
          pip install yq
          xq '.. | select(type == "object") | select(has("flakyFailure"))' junit.xml > flaky_tests.json
          echo has_flaky_tests=$(jq '. | has("flakyFailure")' flaky_tests.json) >> $GITHUB_OUTPUT
      - name: Get flaky test details
        id: get-flaky-tests
        if: ${{ steps.process-test-report.outputs.has_flaky_tests == 'true' }}
        run: |
          echo "Flaky tests found"
          echo test=$(jq '.["@name"]' flaky_tests.json -r ) >> $GITHUB_OUTPUT
          delimiter="###r###"
          echo "content<<$delimiter" >> $GITHUB_OUTPUT
          echo "$(jq '[.flakyFailure] | flatten | .[0]["system-err"]' flaky_tests.json -r)" >> $GITHUB_OUTPUT
          echo $delimiter >> $GITHUB_OUTPUT
      - name: pull issue template
        if: ${{ steps.process-test-report.outputs.has_flaky_tests == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/ISSUE_TEMPLATE/flaky_test.md
          sparse-checkout-cone-mode: false
      - name: Create issue for flaky tests
        continue-on-error: true
        id: create-issue
        if: ${{ steps.process-test-report.outputs.has_flaky_tests == 'true' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_NAME: ${{ steps.get-flaky-tests.outputs.test }}
          SYSTEM_ERROR: ${{ steps.get-flaky-tests.outputs.content }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ github.job }}
          SHA: ${{ github.sha }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          BRANCH: ${{ github.ref }}
          OS: ${{ matrix.os }}
          PR: "#${{ github.event.pull_request.number }}"
        with:
          filename: .github/ISSUE_TEMPLATE/flaky_test.md
          update_existing: true
