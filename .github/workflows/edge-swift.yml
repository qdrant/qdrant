name: Qdrant Edge Swift SDK

# Consistency gate for the Swift SDK: the Swift bindings are regenerated from
# the `qdrant-edge-ffi` crate on every build, so a change to the FFI can silently
# change (or break) the SDK. This workflow rebuilds the XCFramework from the
# current FFI, runs the Swift tests, and enforces the mobile-safety invariants,
# so an FFI change that breaks the SDK — or re-leaks the excluded `search_matrix`
# op onto the mobile surface — turns the build red.
#
# macOS-only (needs Xcode + the Apple cross-compilation targets), and gated to
# the edge FFI/Swift paths so the macOS runner minutes are spent only when
# relevant.

on:
  push:
    branches: [ master, dev ]
    paths:
      - 'lib/edge/ffi/**'
      - 'lib/edge/swift/**'
      - 'lib/edge/VERSION'
      - '.github/workflows/edge-swift.yml'
  pull_request:
    branches: [ '**' ]
    paths:
      - 'lib/edge/ffi/**'
      - 'lib/edge/swift/**'
      - 'lib/edge/VERSION'
      - '.github/workflows/edge-swift.yml'

permissions:
  contents: read

jobs:
  edge-swift:
    name: Build & test Swift SDK
    runs-on: macos-latest

    steps:
      - name: Checkout Qdrant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps build repository-controlled Rust; never leave the token
          # in .git/config. This job never pushes.
          persist-credentials: false

      # The workspace uses unstable features (cfg_select in lib/common,
      # ptr_as_ref_unchecked), so nightly is required — make it the default
      # toolchain so build-xcframework.sh's plain `cargo build` uses it. The
      # Apple targets are installed here for that toolchain.
      - name: Install Rust nightly + Apple targets
        uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
        with:
          targets: >-
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios,
            aarch64-apple-darwin,
            x86_64-apple-darwin

      - name: Install Protoc
        uses: ./.github/actions/setup-protoc

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: edge-swift
          # Only save on dev; feature-branch caches just get evicted under the budget.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # Regenerates the bindings from the current FFI and builds the iOS+macOS
      # XCFramework (tvOS/visionOS are tier-3, excluded here).
      - name: Build XCFramework (iOS + macOS)
        working-directory: lib/edge/swift
        run: make build

      # Fail-closed mobile-safety gate: the mobile build drops the default-on
      # `matrix` feature, so the O(n^2) `search_matrix` op must be absent from
      # the shipped surface. A regression (e.g. a dropped --no-default-features
      # flag) turns this red.
      #
      # Checked against the generated Swift bindings AND the generated C header
      # (`QdrantEdgeFFI.h`) — the real exported FFI vocabulary, which is
      # feature-gated and NOT stripped. (An earlier `nm` scan of the static libs
      # was vacuous: `release-mobile` sets `strip = "symbols"`, so `nm` sees no
      # UniFFI symbols at all and would pass regardless. A `strings` scan is also
      # wrong — it false-positives on engine-internal `SearchMatrixRequestBuilder`
      # that is compiled in regardless of the FFI feature.)
      - name: Enforce search_matrix exclusion
        working-directory: lib/edge/swift
        run: |
          set -euo pipefail
          for f in out/swift-bindings/QdrantEdge.swift out/swift-bindings/QdrantEdgeFFI.h; do
            # Fail closed if a file we must scan is missing (an `if grep … "$f"`
            # on an absent file is a false condition under set -e, i.e. would
            # silently pass the exclusion check).
            if [ ! -f "$f" ]; then
              echo "::error::expected generated file $f is missing — did the build run?"
              exit 1
            fi
            if grep -qiE 'search_?matrix' "$f"; then
              echo "::error::search_matrix present in $f (expected --no-default-features to drop it)"
              exit 1
            fi
          done
          # Canary: the gate must be able to SEE a symbol that is definitely
          # present, so it cannot pass vacuously if the header path/format drifts.
          if ! grep -q 'edgeshard_search' out/swift-bindings/QdrantEdgeFFI.h; then
            echo "::error::canary failed — 'edgeshard_search' absent from QdrantEdgeFFI.h; the gate is scanning the wrong file"
            exit 1
          fi
          echo "OK: search_matrix absent from the mobile surface (canary present)"

      # The Swift release tag, XCFramework URL, and crate all reference one
      # version; keep lib/edge/VERSION and the crate in lock-step.
      - name: Version sync
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < lib/edge/VERSION)"
          crate="$(grep -m1 '^version = ' lib/edge/ffi/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$version" != "$crate" ]; then
            echo "::error::lib/edge/VERSION ($version) != qdrant-edge-ffi crate version ($crate)"
            exit 1
          fi
          # The committed release tag/URL in Package.swift must also track VERSION
          # (release-xcframework.sh regenerates it, but nothing forces that step
          # before a version bump — catch a stale edge-v<old> URL here).
          if ! grep -q "edge-v${version}/" lib/edge/swift/Package.swift; then
            echo "::error::Package.swift releaseURL does not embed edge-v${version}; re-run release-xcframework.sh after bumping VERSION"
            exit 1
          fi
          echo "OK: version $version in sync (VERSION == crate == Package.swift release tag)"

      # Runtime tests on the macOS slice. `swift test`/`xcodebuild test` exit 0
      # with "TEST SUCCEEDED" even when ZERO tests are discovered (e.g. a
      # mistyped test path or an accidental #if that guards out the whole
      # suite), so assert a floor on the executed count — the whole test suite
      # is the primary correctness gate; a vacuous green here validates nothing.
      - name: Swift test (macOS)
        working-directory: lib/edge/swift
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test 2>&1 | tee "$log"
          n="$(grep -oE 'Executed [0-9]+ test' "$log" | grep -oE '[0-9]+' | sort -rn | head -1 || true)"
          if [ -z "${n:-}" ] || [ "$n" -lt 20 ]; then
            echo "::error::macOS test run executed ${n:-0} tests (expected >= 20) — the suite may not be running"
            exit 1
          fi
          echo "macOS: executed $n tests"

      # Runtime tests on the iOS Simulator slice (device names vary across
      # runners, so pick the first available iPhone simulator by UDID).
      - name: Swift test (iOS Simulator)
        working-directory: lib/edge/swift
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available | grep -m1 'iPhone' \
            | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')"
          if [ -z "$udid" ]; then echo '::error::no iPhone simulator available on the runner'; exit 1; fi
          echo "Using iOS Simulator $udid"
          log="$(mktemp)"
          xcodebuild test -scheme QdrantEdge -destination "id=$udid" -skipPackagePluginValidation 2>&1 | tee "$log"
          n="$(grep -oE 'Executed [0-9]+ test' "$log" | grep -oE '[0-9]+' | sort -rn | head -1 || true)"
          if [ -z "${n:-}" ] || [ "$n" -lt 20 ]; then
            echo "::error::iOS test run executed ${n:-0} tests (expected >= 20) — the suite may not be running"
            exit 1
          fi
          echo "iOS: executed $n tests"

      # The shipped example must compile against the SDK's current API.
      - name: Build example
        working-directory: lib/edge/swift/example
        run: swift build
