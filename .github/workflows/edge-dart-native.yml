name: Qdrant Edge Dart SDK — native prebuilts

# Cross-builds the qdrant-edge-ffi cdylib for every platform the Dart SDK ships,
# packages each as a checksum-pinned tar.gz, and publishes them to a GitHub
# Release (tag edge-dart-native-v<lib/edge/VERSION>). The SDK's prebuilt-download
# hook fetches + SHA256-verifies these, so consumers need no Rust toolchain.
#
# Built --no-default-features (drops the O(n^2) search_matrix op, parity with the
# Swift/Kotlin mobile SDKs) on nightly (sysinfo needs rustc >= 1.95).

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish archives to a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CRATE: qdrant-edge-ffi

defaults:
  run:
    shell: bash

jobs:
  # cargo-native targets (Linux / Windows / macOS / iOS) — one cdylib each.
  cargo:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux_x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  file: libqdrant_edge_ffi.so }
          - { name: linux_arm64,    os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libqdrant_edge_ffi.so }
          - { name: windows_x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc,    file: qdrant_edge_ffi.dll }
          - { name: macos_arm64,    os: macos-latest,     target: aarch64-apple-darwin,      file: libqdrant_edge_ffi.dylib }
          - { name: ios_arm64,      os: macos-latest,     target: aarch64-apple-ios,         file: libqdrant_edge_ffi.dylib }
          - { name: ios_sim_arm64,  os: macos-latest,     target: aarch64-apple-ios-sim,     file: libqdrant_edge_ffi.dylib }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }

      - name: Install Rust nightly (+ target)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # iOS deployment target — matches the Swift XCFramework build (min iOS 15).
      - name: iOS deployment target
        if: startsWith(matrix.target, 'aarch64-apple-ios')
        run: echo "IPHONEOS_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"

      - name: Build cdylib
        run: |
          cargo +nightly build --locked --no-default-features --release \
            --target "${{ matrix.target }}" -p "$CRATE"

      - name: Collect
        run: |
          mkdir -p "out/${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "out/${{ matrix.name }}/"
          ls -lh "out/${{ matrix.name }}/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-dart-native-${{ matrix.name }}
          path: out/${{ matrix.name }}

  # Android via cargo-ndk (arm64 devices + x86_64 emulators).
  android:
    name: android_${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android, dir: arm64 }
          - { abi: x86_64,    target: x86_64-linux-android,  dir: x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }

      - name: Install Rust nightly (+ Android target)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .so
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo +nightly ndk -t "${{ matrix.abi }}" build \
            --locked --no-default-features --release -p "$CRATE"

      - name: Collect
        run: |
          mkdir -p "out/android_${{ matrix.dir }}"
          cp "target/${{ matrix.target }}/release/libqdrant_edge_ffi.so" "out/android_${{ matrix.dir }}/"
          ls -lh "out/android_${{ matrix.dir }}/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-dart-native-android_${{ matrix.dir }}
          path: out/android_${{ matrix.dir }}

  # Package each platform as a tar.gz, checksum, and publish to the Release.
  publish:
    name: Package + release
    needs: [cargo, android]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }

      - name: Read VERSION
        run: echo "VERSION=$(tr -d '[:space:]' < lib/edge/VERSION)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          pattern: edge-dart-native-*

      - name: Package + checksums
        run: |
          mkdir -p release
          for d in artifacts/edge-dart-native-*; do
            name="$(basename "$d" | sed 's/^edge-dart-native-//')"
            tar -czf "release/qdrant-edge-ffi-${name}.tar.gz" -C "$d" .
            echo "packaged qdrant-edge-ffi-${name}.tar.gz"
          done
          cd release && sha256sum *.tar.gz | tee checksums.txt

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: edge-dart-native-v${{ env.VERSION }}
          name: Qdrant Edge Dart — native prebuilts v${{ env.VERSION }}
          body: |
            Prebuilt `qdrant_edge_ffi` cdylibs for the Qdrant Edge Dart SDK
            (UniFFI binding of the shared `qdrant-edge-ffi` crate), one archive
            per platform. The SDK's Native Assets hook downloads and
            SHA256-verifies these, so consumers need no Rust toolchain.

            Built `--no-default-features` (no `search_matrix`) on nightly. Copy
            the `sha256` lines from `checksums.txt` into the SDK hook's pin table.
          files: release/*
          fail_on_unmatched_files: false
