name: Integration tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ '**' ]

concurrency:
  # Pushes to dev/master get a unique group and always run to completion
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: 0.9.17

jobs:
  # Builds the debug binary once; the integration and consensus test jobs download it.
  build-qdrant:

    runs-on: ubuntu-latest

    steps:
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: integration-tests
          # Only save the cache on dev; feature-branch caches would just get evicted under the 10 GB budget
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Install dependencies
        run: sudo apt-get install clang
      - name: Build
        run: cargo build --features "service_debug data-consistency-check staging" --locked
      - name: Upload qdrant binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qdrant-debug
          path: target/debug/qdrant
          retention-days: 1

  integration-tests:
    needs: build-qdrant
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [single, distributed]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv and Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/$UV_VERSION/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --project tests lock --check
          uv --project tests sync
      - name: Download qdrant binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qdrant-debug
          path: target/debug
      - name: Make qdrant binary executable
        # Artifacts don't keep file permissions
        run: chmod +x target/debug/qdrant
      - name: Run integration tests
        run: uv --project tests run bash ./tests/integration-tests.sh ${{ matrix.mode == 'distributed' && 'distributed' || '' }}
        shell: bash

  integration-tests-consensus:
    needs: build-qdrant
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv and Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/$UV_VERSION/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --project tests lock --check
          uv --project tests sync
      - name: Download qdrant binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qdrant-debug
          path: target/debug
      - name: Make qdrant binary executable
        run: chmod +x target/debug/qdrant
      - name: Run integration tests - multiple peers - pytest (shard ${{ matrix.shard }}/3)
        # pytest-split balances shards with tests/consensus_tests/.test_durations; contiguous chunks keep
        # each test file (and its module-scoped cluster) in one shard. Each shard uploads the durations of
        # its own tests; to refresh the file from a dev run:
        #   gh run download <run-id> -p 'consensus-test-durations-*'
        #   jq -S -s add consensus-test-durations-*/.test_durations > tests/consensus_tests/.test_durations
        run: |
          uv --project tests run pytest -n auto --dist=loadfile -v tests/consensus_tests --durations=10 \
            --splits 3 --group ${{ matrix.shard }} \
            --durations-path tests/consensus_tests/.test_durations --store-durations --clean-durations
        timeout-minutes: 60
      - name: Upload test durations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consensus-test-durations-${{ matrix.shard }}
          path: tests/consensus_tests/.test_durations
          include-hidden-files: true
          retention-days: 7
      - name: upload logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          path: consensus_test_logs
          name: consensus-test-logs-${{ matrix.shard }}
          retention-days: 10

  test-consensus-compose:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv and Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/$UV_VERSION/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --project tests lock --check
          uv --project tests sync
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: qdrant_consensus
          cache-from: type=gha,scope=docker-integration-tests
          cache-to: ${{ github.event_name == 'push' && github.ref_name == 'dev' && 'type=gha,mode=max,scope=docker-integration-tests' || '' }}
          load: true
          build-args: |
            PROFILE=ci
            FEATURES=staging
      - name: Run integration tests - multiple peers - compose
        run: uv --project tests run bash ./test_restart.sh
        working-directory: ./tests/consensus_tests

  test-consistency:

    runs-on: ubuntu-latest

    steps:
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install dependencies
        run: sudo apt-get install -y clang jq
      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/schema2openapi
          tags: schema2openapi
          load: true
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - name: gRPC file consistency check
        run: ./tests/grpc_consistency_check.sh
      - name: OpenAPI file consistency check
        run: ./tests/openapi_consistency_check.sh

  test-shard-snapshot-api-s3-minio:
    runs-on: ubuntu-latest
    # Setup minio server
    services:
      minio:
        image: satantime/minio-server
        ports:
          - 9000:9000
        env:
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"
    steps:
      - name: Setup test bucket
        env:
          AWS_ACCESS_KEY_ID: "minioadmin"
          AWS_SECRET_ACCESS_KEY: "minioadmin"
          AWS_EC2_METADATA_DISABLED: "true"
        run: echo $(aws --endpoint-url http://127.0.0.1:9000/ s3 mb s3://test-bucket)
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: integration-tests
          # integration-tests is the broadest build in this group and owns saving the cache
          save-if: "false"
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
      - name: Install dependencies
        run: sudo apt-get install clang jq
      - name: Build
        run: cargo build --bin qdrant --features "staging" --locked
      - name: Run Shard Snapshot API Tests (local)
        timeout-minutes: 15
        run: ./tests/shard-snapshot-api-tests.sh
      - name: Run Shard Snapshot API Tests (s3)
        timeout-minutes: 15
        env:
          QDRANT__STORAGE__SNAPSHOTS_CONFIG__SNAPSHOTS_STORAGE: s3
          QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__BUCKET: test-bucket
          QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__REGION: us-east-1
          QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__ACCESS_KEY: minioadmin
          QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__SECRET_KEY: minioadmin
          QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__ENDPOINT_URL: http://127.0.0.1:9000
        run: ./tests/shard-snapshot-api-tests.sh

  # Builds the e2e image once; the e2e test jobs download it.
  build-e2e-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true  # Fetch LFS files automatically
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Qdrant Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: qdrant/qdrant:e2e-tests
          cache-from: type=gha,scope=docker-e2e-tests
          cache-to: ${{ github.event_name == 'push' && github.ref_name == 'dev' && 'type=gha,mode=max,scope=docker-e2e-tests' || '' }}
          outputs: type=docker,dest=/tmp/e2e-image.tar
          build-args: |
            PROFILE=ci
            FEATURES=data-consistency-check,staging
      - name: Compress image
        run: zstd -T0 -3 --rm /tmp/e2e-image.tar -o /tmp/e2e-image.tar.zst
      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image
          path: /tmp/e2e-image.tar.zst
          compression-level: 0
          retention-days: 1

  e2e-tests:
    needs: build-e2e-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: other
            pytest-args: -n 4 --dist=loadgroup tests/e2e_tests --ignore=tests/e2e_tests/test_data_compatibility.py
          # Compatibility tests download large archives and run one at a time to spare the disk,
          # so they get their own runners: 3 shards of the versions.
          - group: compatibility-1
            pytest-args: tests/e2e_tests/test_data_compatibility.py --splits 3 --group 1
          - group: compatibility-2
            pytest-args: tests/e2e_tests/test_data_compatibility.py --splits 3 --group 2
          - group: compatibility-3
            pytest-args: tests/e2e_tests/test_data_compatibility.py --splits 3 --group 3

    # Setup minio server
    services:
      minio:
        image: satantime/minio-server
        ports:
          - 9000:9000
        env:
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"

    steps:
      - name: Setup test bucket
        env:
          AWS_ACCESS_KEY_ID: "minioadmin"
          AWS_SECRET_ACCESS_KEY: "minioadmin"
          AWS_EC2_METADATA_DISABLED: "true"
        run: echo $(aws --endpoint-url http://127.0.0.1:9000/ s3 mb s3://test-bucket)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true  # Fetch LFS files automatically
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv and Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/$UV_VERSION/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --project tests lock --check
          uv --project tests sync
      - name: Download Qdrant image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-image
          path: /tmp
      - name: Load Qdrant image
        run: zstd -dc /tmp/e2e-image.tar.zst | docker load
      - name: Verify Docker image
        run: docker images | grep qdrant
      - name: Run e2e tests (${{ matrix.group }})
        run: uv --project tests run pytest ${{ matrix.pytest-args }} -v --tb=short --durations=5 -m "not longrunning"
        shell: bash
        timeout-minutes: 20
      - name: Upload test logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-test-logs-${{ matrix.group }}
          path: |
            tests/e2e_tests/test_*.log
            tests/e2e_tests/**/logs/
          retention-days: 7
