[package]
name = "edge-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[[bin]]
name = "edge-wasm"
path = "src/main.rs"

[dependencies]
common = { path = "../../common/common" }
edge = { path = ".." }
segment = { path = "../../segment", default-features = false }
shard = { path = "../../shard", default-features = false }

serde_json = { workspace = true }
# Default features off: no TLS backend, so this speaks `http://` only. `ureq` blocks on
# `std::net::TcpStream`, which WASI provides — that is what makes the synchronous read path work.
ureq = { version = "3", default-features = false }

[dev-dependencies]
common = { path = "../../common/common", features = ["testing"] }

tempfile = { workspace = true }
walkdir = { workspace = true }
