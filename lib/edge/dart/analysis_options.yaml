# A published ruleset so `dart analyze` meaningfully lints the hand-written code
# (hook/, example/, test/) — not just default diagnostics.
include: package:lints/recommended.yaml

analyzer:
  # lib/src/qdrant_edge_ffi.dart is generated by uniffi-bindgen-dart (./build.sh);
  # don't lint machine-generated code. Its few unused-import/element warnings are
  # generator quirks and are cleaned up upstream, not by hand-editing here.
  exclude:
    - lib/src/qdrant_edge_ffi.dart
