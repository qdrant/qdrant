# The Edge workspace uses unstable std/library features (e.g.
# `ptr_as_ref_unchecked` and `cfg_select` in lib/common), so ALL cargo builds
# under this SDK require nightly — not just the tier-3 tvOS/visionOS targets that
# additionally need `-Z build-std`. Pinning nightly here lets `make build` work
# with a plain rustup `cargo` invocation and removes the stable-vs-nightly
# ambiguity in build-xcframework.sh. (Applies only when cargo is invoked from
# within lib/edge/swift/, e.g. by the Makefile; the rest of the workspace is
# unaffected.)
[toolchain]
channel = "nightly"
components = ["rust-src"]
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
