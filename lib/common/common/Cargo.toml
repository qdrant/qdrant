[package]
name = "common"
version = "0.0.0"
authors = [
    "Andrey Vasnetsov <vasnetsov93@gmail.com>",
    "Qdrant Team <info@qdrant.tech>",
]
license = "Apache-2.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
testing = []

[dependencies]
ahash = { workspace = true }
aligned-vec = "0.6.4"
bincode = { workspace = true }
bitvec = { workspace = true }
bytemuck = { workspace = true }
chrono = { workspace = true }
fs-err = { workspace = true }
fs_extra = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = "1.17"
ordered-float = { workspace = true }
parking_lot = { workspace = true }
ph = { workspace = true }
quick_cache = "0.7.0"
rand = { workspace = true }
roaring = { workspace = true }
schemars = { workspace = true }
self_cell = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slab = { workspace = true }
strum = { workspace = true }
tar = { workspace = true }
tap = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
# Not `workspace = true`: the workspace entry enables `full`, whose `net`/`fs`/`process` features
# do not build for wasm32. This is the subset `common` itself needs; the non-wasm table below adds
# `full` back on top (features are additive), so native builds are unchanged.
tokio = { version = "1.52.3", default-features = false, features = ["sync", "rt", "macros", "io-util", "time"] }
validator = { workspace = true }
walkdir = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomicwrites = { workspace = true }
fs4 = { workspace = true }
nix = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `getrandom` has no default backend on wasm32; both major versions are in the tree and each
# needs its browser backend enabled explicitly.
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4.2", features = ["wasm_js"] }
# `std::time::Instant::now()` panics on wasm32; see `crate::time`.
web-time = "1.1.0"

[dev-dependencies]
common = { path = ".", features = ["testing"] }
criterion = { workspace = true }
duplicate = "2.0.1"
fs-err = { workspace = true, features = ["debug"] }
rstest = { workspace = true }
static_assertions = "1.1.0"
tango-bench = "0.7.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.12"
procfs = { version = "0.18", default-features = false }
thread-priority = "3.0.0"

[[bench]]
name = "bitpacking"
harness = false

[[bench]]
name = "bitpacking_tango"
harness = false

[[bench]]
name = "mmap_hashmap"
harness = false

[[bench]]
name = "hw_counter"
harness = false

[[bench]]
name = "atomic_stop"
harness = false

[[bench]]
name = "universal_io"
harness = false
